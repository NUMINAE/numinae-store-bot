[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numinae-store"
version = "0.1.0"
description = "A Telegram storefront for digital goods, paid with Telegram Stars"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NUMINAE" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot[job-queue]>=22.8,<23",
    "pydantic>=2,<3",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["migrations/*.sql", "seed_demo.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and obviously fake credentials, and run the bot's own
# interpreter (sys.executable) with fixed arguments in subprocesses (S603).
"tests/**" = ["S101", "S105", "S106", "S603"]
# Customer-facing prose; the strings are single literals the formatter cannot wrap.
"bot/i18n.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
warn_unused_ignores = true
files = ["bot", "tests"]

[[tool.mypy.overrides]]
module = [
    "bot.repo.*",
    "bot.security",
    "bot.keyboards",
    "bot.i18n",
    "bot.render",
    "bot.ratelimit",
    "bot.owner_notify",
    "bot.delivery",
    "bot.payments.*",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test (a missing lock, an awaited event that never fires) fails after 30 s
# instead of stalling the run.
timeout = 30

[tool.coverage.run]
source = ["bot"]
branch = true
# The entrypoint wires handlers to Telegram and is not unit tested.
omit = ["bot/main.py"]

# Thresholds differ by area, so they are enforced by two `coverage report`
# runs (see CI and the README): 80% outside bot/handlers, 60% inside it.
[tool.coverage.report]
show_missing = true
