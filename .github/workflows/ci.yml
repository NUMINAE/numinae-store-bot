name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest --cov --cov-fail-under=0
      - name: Coverage (80% outside handlers)
        run: coverage report --omit="bot/handlers/*" --fail-under=80
      - name: Coverage (60% in handlers)
        run: coverage report --include="bot/handlers/*" --fail-under=60
      - name: Wheel contains migrations
        run: |
          pip wheel . --no-deps -w dist-check
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-check/*.whl")[0]).namelist()
          assert any(n.startswith("bot/migrations/") and n.endswith(".sql") for n in names), names
          assert "bot/seed_demo.json" in names, names
          PY
