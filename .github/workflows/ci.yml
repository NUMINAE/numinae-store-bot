name: CI

on:
  push:
    branches: [master]  # branches only: a tag does not start a run
  pull_request:  # all branches
  workflow_dispatch:
  schedule:
    # Weekly, so new advisories against our dependencies are caught without a push.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov --cov-fail-under=0
      - name: Coverage (80% outside handlers)
        run: coverage report --omit="bot/handlers/*" --fail-under=80
      - name: Coverage (60% in handlers)
        run: coverage report --include="bot/handlers/*" --fail-under=60

  audit:
    # Also runs weekly (see the schedule above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the project and pip-audit
        run: pip install . pip-audit
      - name: Audit installed dependencies
        # Exits non-zero on any known vulnerability.
        run: pip-audit --skip-editable

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # Dummy, non-secret values: they only let the config load. They are passed to the
      # container by name (-e NAME), so no value appears in a command line or the log.
      BOT_TOKEN: dummy-token-not-real
      OWNER_ID: "1"
      PAYMENT_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist-check
      - name: The wheel contains the migrations, the demo seed and the new modules
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-check/*.whl")[0]).namelist()
          assert any(n.startswith("bot/migrations/") and n.endswith(".sql") for n in names), names
          assert "bot/seed_demo.json" in names, names
          for module in ("concurrency", "health", "backup", "dbpath"):
              assert f"bot/{module}.py" in names, module
          PY
      - name: Build the Docker image (not pushed)
        run: docker build --tag numinae-store:ci .
      - name: The image runs as uid 10001
        run: |
          uid="$(docker run --rm --entrypoint id numinae-store:ci -u)"
          test "$uid" = "10001"
      - name: --check-config in the image prints one line and exits 0
        run: |
          out="$(docker run --rm -e BOT_TOKEN -e OWNER_ID -e PAYMENT_MODE \
            numinae-store:ci python -m bot.main --check-config)"
          test "$out" = "config ok, mode=mock"
          case "$out" in *"$BOT_TOKEN"*) echo "secret in output" >&2; exit 1;; esac
      - name: --healthcheck with no data volume fails with "no heartbeat"
        run: |
          set +e
          out="$(docker run --rm numinae-store:ci python -m bot.main --healthcheck)"
          code=$?
          set -e
          test "$code" -eq 1
          test "$out" = "no heartbeat"

      - name: Startup under the compose restrictions
        # Runs the image the way docker-compose.yml does. With a fake token the bot is
        # expected to start, apply its migrations, then exit 1 when Telegram rejects the
        # token. Env values are passed by name (-e NAME) and never echoed.
        run: |
          VOL="numinae-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUT="$(mktemp)"
          cleanup() {
            docker rm -f "$VOL-bot" >/dev/null 2>&1 || true
            docker volume rm -f "$VOL" >/dev/null 2>&1 || true
            rm -f "$OUT"
          }
          trap cleanup EXIT
          docker volume create "$VOL" >/dev/null

          # Shaped like a real token (digits, a colon, 35 URL-safe characters) so the
          # redaction is exercised; built from parts, and a fake.
          BOT_TOKEN="123456789:AAH$(printf 'x%.0s' $(seq 32))"
          export BOT_TOKEN OWNER_ID=1 PAYMENT_MODE=mock SEED_DEMO=true

          set +e
          timeout 180 docker run --rm --init --name "$VOL-bot" \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume "$VOL":/app/data \
            -e BOT_TOKEN -e OWNER_ID -e PAYMENT_MODE -e SEED_DEMO \
            numinae-store:ci >"$OUT" 2>&1
          code=$?
          set -e

          fail() { echo "FAILED: $1" >&2; echo "--- container output ---" >&2; cat "$OUT" >&2; exit 1; }

          test "$code" -eq 1 || fail "expected exit code 1, got $code"
          grep -qF "DEMO MODE: Pay (demo) grants real content without payment." "$OUT" \
            || fail "no mock-mode DEMO warning"
          grep -qF "Applied migration" "$OUT" || fail "no 'Applied migration' line"
          for bad in "Permission denied" "readonly database" "Read-only file system" \
              "unable to open database"; do
            if grep -qiF "$bad" "$OUT"; then fail "output contains: $bad"; fi
          done
          if grep -qE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' "$OUT"; then fail "token-shaped text in output"; fi

          # A second container on the same volume: the database exists and is owned by 10001.
          owner="$(docker run --rm --volume "$VOL":/app/data --entrypoint python numinae-store:ci \
            -c 'import os; print(os.stat("data/shop.db").st_uid)')"
          test "$owner" = "10001" || fail "data/shop.db owner is not 10001"
